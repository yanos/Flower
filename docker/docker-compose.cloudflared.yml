# Cloudflare Tunnel: no open port, nothing for listeners to install.
#
#   export FLOWER_HOSTNAME=music.example.com
#   export TUNNEL_TOKEN=<the token from the Cloudflare dashboard>
#   docker compose -f docker-compose.yml -f docker-compose.cloudflared.yml up -d
#
# Caveat: Cloudflare decrypts your traffic and its terms allow throttling it.
# See docs/SELF-HOSTING.md, "Cloudflare Tunnel".

services:
  flower:
    environment:
      # cloudflared connects over loopback; trust it so each listener keeps its own IP.
      - Flower__TrustedProxies__0=127.0.0.1/32
      - Flower__AdvertisedHost=https://${FLOWER_HOSTNAME:?set FLOWER_HOSTNAME to the tunnel hostname}
      - Flower__AdvertiseOnLan=true

    # Also turn on AllowPublicAccess in the settings page (not here: this would
    # outrank the page). Until then, outside listeners are refused.

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: flower-cloudflared
    restart: unless-stopped
    # So localhost:4533 is the server.
    network_mode: host
    depends_on:
      - flower
    # Remotely-managed tunnel: in the Cloudflare dashboard, point its ingress at
    # http://localhost:4533.
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:?set TUNNEL_TOKEN from the Cloudflare dashboard}
