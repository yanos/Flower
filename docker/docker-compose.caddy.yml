# Port forwarding with Caddy in front, for browser listeners (they need a real
# certificate). App-only listeners don't need this: just forward 4534.
#
#   export FLOWER_HOSTNAME=music.example.com
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d
#
# Forward 80 and 443 to this machine (80 is for Let's Encrypt). Never forward 4533.

services:
  flower:
    environment:
      # Caddy connects over loopback; trust it so each listener keeps its own IP.
      - Flower__TrustedProxies__0=127.0.0.1/32
      # The address given to clients. The https:// matters.
      - Flower__AdvertisedHost=https://${FLOWER_HOSTNAME:?set FLOWER_HOSTNAME to the public name}
      # LAN discovery stays on alongside the public address.
      - Flower__AdvertiseOnLan=true

    # Also turn on AllowPublicAccess in the settings page (not here: this would
    # outrank the page). Until then, outside listeners are refused.

  caddy:
    image: caddy:2-alpine
    container_name: flower-caddy
    restart: unless-stopped
    # Owns 80/443 on the host and reaches the server on loopback.
    network_mode: host
    depends_on:
      - flower
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates. Keep them, or Let's Encrypt rate-limits re-issuing.
      - ./caddy-data:/data
      - ./caddy-config:/config
    environment:
      - FLOWER_HOSTNAME=${FLOWER_HOSTNAME:?set FLOWER_HOSTNAME to the public name}
