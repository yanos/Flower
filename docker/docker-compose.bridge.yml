# Published ports instead of host networking.
#
#   docker compose -f docker-compose.yml -f docker-compose.bridge.yml up -d
#
# Use on macOS/Windows (host networking binds to Docker's VM, not your machine),
# or on Linux when the server is reached only via a proxy or tailnet.
# Not for LAN discovery on Linux: a bridge drops mDNS.

services:
  flower:
    network_mode: bridge

    ports:
      # If you remap the left side, set FLOWER_ADVERTISED_HOST to match.
      - "${FLOWER_HTTP_PORT:-4533}:4533"
      - "${FLOWER_HTTPS_PORT:-4534}:4534"

    environment:
      # mDNS can't leave a bridge, so it's off rather than failing silently.
      # Clients reach the server by the address given at pairing.
      - Flower__AdvertiseOnLan=false

      # The address clients should dial (the container only sees its 172.x one).
      # Lets devices follow the server if its address changes. Examples:
      #   FLOWER_ADVERTISED_HOST=192.168.1.40
      #   FLOWER_ADVERTISED_HOST=https://music.example.com
      # Not a .local name: iOS can't resolve it through this path.
      - Flower__AdvertisedHost=${FLOWER_ADVERTISED_HOST:-}

    # AllowPublicAccess is set from the settings page, not here (this would
    # silently outrank the page).
    #
    # Warning: on VM runtimes (Docker Desktop, colima, ...) every caller arrives
    # from the Docker gateway. They all look like LAN and share one rate limit.
    # Device signatures still protect every route. Don't port-forward straight at
    # this; use caddy, cloudflared, or host networking on Linux.
