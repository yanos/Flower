# Flower.Server on a Linux box.
#
#   cd docker
#   echo "FLOWER_MUSIC=/srv/music" > .env
#   docker compose up -d
#   docker compose logs flower     # the pairing code is in here
#
# Overrides, merged on top with -f:
#   docker-compose.non-linux.yml    macOS/Windows, where host networking cannot work
#   docker-compose.caddy.yml        port forwarding with a real certificate (for browsers)
#   docker-compose.cloudflared.yml  Cloudflare Tunnel
#
# Tailscale, or forwarding 4534 for app-only listeners, needs no override.
# See docs/SELF-HOSTING.md.

# Pinned: the project name prefixes the data volume, so changing it means a new,
# empty volume and every device unpaired.
name: flower

services:
  flower:
    # Moves only on `docker compose pull`. Pin a version (:0.2.1) to stay put.
    # FLOWER_IMAGE swaps in an unreleased build (scripts/build-server-image.sh).
    image: ${FLOWER_IMAGE:-ghcr.io/yanos/flower-server:latest}
    # Or build from source (then `docker compose up -d --build`):
    # build:
    #   context: ..
    #   dockerfile: docker/Dockerfile
    container_name: flower
    restart: unless-stopped

    # Required for LAN discovery: a bridge drops mDNS multicast. Linux only.
    # Elsewhere, use docker-compose.non-linux.yml instead of editing this.
    network_mode: host

    volumes:
      # Server state. Lose it and every device unpairs.
      # A named volume, so it starts writable by the server's user (1654).
      # Backup: docker compose cp flower:/data ./flower-backup
      - flower-data:/data

      # Your music, read-only. No default, so a wrong path fails loudly
      # instead of serving an empty library.
      - ${FLOWER_MUSIC:?set FLOWER_MUSIC to your music folder, e.g. in a .env file beside this one}:/music:ro

    # Only if uid 1654 can't read your music (better: make it readable). If you
    # set this, hand the data volume over once:
    #   docker compose run --rm --user root --entrypoint chown flower -R 1000:1000 /data
    #
    #   user: "1000:1000"

    environment:
      # The name shown in clients' sidebars.
      - Flower__Alias=Flower

      # Any appsettings.json key works here (Flower__HttpsPort=0 disables TLS).
      # These outrank flower-server.json on the data volume.

volumes:
  # Survives `down`; `down -v` deletes it and unpairs everything.
  flower-data:
