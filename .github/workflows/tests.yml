name: Tests

on:
  push:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      # Full history, so MinVer sees the tags and commit height it versions
      # these binaries from. actions/checkout defaults to depth 1, which
      # silently yields MinVer's 0.0.0-alpha.0 fallback instead.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Flower.csproj (the shared library Flower.Tests references) targets
      # net10.0 only. This comment previously claimed it multi-targeted
      # net10.0;net9.0, which has not been true for some time - see
      # ARCHITECTURE-REVIEW Tier 5.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Flower/Flower.csproj
            Flower.Tests/Flower.Tests.csproj

      # The RequiresFfmpeg tests fail rather than skip without the façade -
      # deliberately, since a decoder silently not under test is the failure
      # mode this whole area keeps hitting - so every platform builds it. That
      # is new for Windows, which used to filter those tests out by name for
      # want of a façade to run them against.
      - name: Build flower-ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libavformat-dev libavcodec-dev libavutil-dev libswresample-dev
          native/ffmpeg/linux/build.sh

      - name: Build flower-ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg
          native/ffmpeg/macos/build.sh

      # Windows has neither an FFmpeg to find nor a pkg-config to ask, so its
      # script downloads a published LGPL build instead of compiling one - see
      # native/ffmpeg/windows/build.ps1. That is why this step is a one-liner
      # where the mobile equivalents would be tens of minutes, and why the
      # RequiresFfmpeg tests are no longer filtered out below.
      - name: Build flower-ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: ./native/ffmpeg/windows/build.ps1
        shell: pwsh

      # None of the hosted runner images ship VLC, so RequiresLibVLC-tagged
      # tests (real-decode/native-audio coverage) don't run here - same
      # "fast, day-to-day" filter as CLAUDE.md's local dev instructions.
      - name: Run tests
        run: dotnet test Flower.Tests/Flower.Tests.csproj --configuration Release --filter "Category!=RequiresLibVLC"

  decode-checks:
    # Does each platform actually turn a track into the right audio? The rest
    # of the suite answers that on whatever machine happens to run it; this
    # job answers it per-OS, on the same checks Flower.DeviceChecks.iOS runs
    # on a simulator - see Flower.DeviceChecks/DecodeChecks.cs.
    #
    # Its own job rather than a step in `test`, and installing VLC is why: the
    # fast suite must not start failing because a package mirror had a bad
    # morning.
    name: Decode checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Flower/Flower.csproj
            Flower.Tests/Flower.Tests.csproj

      # The checks decode for real, so they need the same VLC the app needs.
      # None of the hosted images ship it.
      #
      # Windows is missing from this list on purpose: there is no install step
      # that would help it. LibVLCSharp only ever looks beside the binary
      # there, so a `choco install vlc` sat in C:\Program Files where nothing
      # searched, and the checks failed with "Failed to load required native
      # libraries" while VLC was installed. Windows takes its LibVLC from the
      # VideoLAN.LibVLC.Windows package instead - see Flower.Tests.csproj -
      # which is also how the shipping Windows app gets it.
      - name: Install VLC (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y vlc libvlc-dev

      - name: Install VLC (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask vlc

      # The checks run once per decoder this platform has, so a platform
      # without a built façade checks LibVLC and nothing else. Building it
      # here is what makes the FFmpeg half of the suite exist on CI at all -
      # it is elected by real users on macOS today and had two outright
      # playback bugs that no green run ever saw, because no green run was
      # running it.
      #
      # A distro or Homebrew FFmpeg is GPL-enabled and fine here; it is not
      # fine in anything that ships. See native/ffmpeg/README.md.
      - name: Build flower-ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y libavformat-dev libavcodec-dev libavutil-dev libswresample-dev
          native/ffmpeg/linux/build.sh

      - name: Build flower-ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg
          native/ffmpeg/macos/build.sh

      # A downloaded LGPL build rather than a compiled one, for the reason the
      # `test` job's copy of this step gives.
      - name: Build flower-ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: ./native/ffmpeg/windows/build.ps1
        shell: pwsh

      - name: Run the decode checks
        # Named rather than left to whatever loaded, because the failure this
        # guards against is a run that goes green having checked half of what
        # it did yesterday: a façade that did not build, or built and would
        # not load, otherwise just shortens the suite. All three desktops have
        # a façade now, so all three are held to both decoders - and Windows
        # is the one where "built and would not load" is a real possibility
        # rather than a formality, since its FFmpeg is four DLLs beside the
        # façade rather than a prefix the loader already knows.
        env:
          FLOWER_REQUIRE_DECODERS: LibVLC,FFmpeg
        run: dotnet test Flower.Tests/Flower.Tests.csproj --configuration Release --filter FullyQualifiedName~DeviceChecksTests --logger "console;verbosity=detailed"

  server-test:
    runs-on: ubuntu-latest

    steps:
      # Full history, so MinVer sees the tags and commit height it versions
      # these binaries from. actions/checkout defaults to depth 1, which
      # silently yields MinVer's 0.0.0-alpha.0 fallback instead.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Flower.Core/Flower.Core.csproj
            Flower.Server/Flower.Server.csproj
            Flower.Server.Tests/Flower.Server.Tests.csproj

      # Flower.Server was previously never compiled by CI at all, let alone
      # tested - `dotnet test Flower.Tests` only ever builds
      # Flower.Tests -> Flower -> Flower.Core (ARCHITECTURE-REVIEW Tier 5.1).
      # That is how four entity source files under Flower.Server/Data/ stayed
      # uncommitted (a .gitignore rule matched the source folder on
      # case-insensitive filesystems) without anyone noticing the server could
      # not build from a clean checkout - which is exactly what this job does.
      - name: Run server tests
        run: dotnet test Flower.Server.Tests/Flower.Server.Tests.csproj --configuration Release

  # Flower.Desktop is the one project the jobs above never compile - the test
  # jobs reach Flower/Flower.Core through Flower.Tests, and the server through
  # its own tests. A build-only gate, deliberately: a project CI never compiles
  # is a project that silently rots.
  build-desktop:
    runs-on: ubuntu-latest

    steps:
      # Full history, so MinVer sees the tags and commit height it versions
      # these binaries from. actions/checkout defaults to depth 1, which
      # silently yields MinVer's 0.0.0-alpha.0 fallback instead.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Flower/Flower.csproj
            Flower.Desktop/Flower.Desktop.csproj

      - name: Build Flower.Desktop
        run: dotnet build Flower.Desktop/Flower.Desktop.csproj --configuration Release

  build-ios:
    runs-on: macos-latest

    steps:
      # Full history, so MinVer sees the tags and commit height it versions
      # these binaries from. actions/checkout defaults to depth 1, which
      # silently yields MinVer's 0.0.0-alpha.0 fallback instead.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # macos-latest defaults to a newer Xcode than the .NET for iOS
      # workload supports (it requires an exact major.minor match); the
      # runner image ships older Xcodes side-by-side, so pin to one that
      # matches. Bump this alongside the iOS workload/SDK version.
      - name: Select Xcode 26.0.1
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer

      # The runner image's preinstalled simulator runtimes are matched to
      # its newer default Xcode versions, not 26.0.1, so actool's asset
      # catalog compile fails ("No simulator runtime version ... available
      # to use with iphonesimulator SDK version ...") without this - see
      # actions/runner-images#13317. Costs ~10-15 min but is the workaround
      # maintainers point to for this exact mismatch.
      - name: Install matching iOS simulator runtime
        run: sudo xcodebuild -downloadPlatform iOS

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Flower/Flower.csproj
            Flower.iOS/Flower.iOS.csproj

      - name: Install iOS workload
        run: dotnet workload install ios

      # Build-only: Flower.Tests has no iOS-specific code, so there's nothing
      # for an on-simulator test run to exercise that this doesn't already
      # cover - this just catches platform-specific compile breaks.
      - name: Build for iOS simulator
        run: dotnet build Flower.iOS/Flower.iOS.csproj --configuration Release -p:RuntimeIdentifier=iossimulator-arm64

  build-android:
    runs-on: ubuntu-latest

    steps:
      # Full history, so MinVer sees the tags and commit height it versions
      # these binaries from. actions/checkout defaults to depth 1, which
      # silently yields MinVer's 0.0.0-alpha.0 fallback instead.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Flower/Flower.csproj
            Flower.Android/Flower.Android.csproj

      - name: Install Android workload
        run: dotnet workload install android

      - name: Build for Android
        run: dotnet build Flower.Android/Flower.Android.csproj --configuration Release

  build-web:
    runs-on: ubuntu-latest

    steps:
      # Full history, so MinVer sees the tags and commit height it versions
      # these binaries from. actions/checkout defaults to depth 1, which
      # silently yields MinVer's 0.0.0-alpha.0 fallback instead.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Flower/Flower.csproj
            Flower.Web/Flower.Web.csproj

      # WasmBuildNative (see Flower.Web.csproj) needs wasm-tools' Emscripten
      # toolchain to statically link libSkiaSharp/libHarfBuzzSharp into the
      # WASM bundle - without it the build fails outright (NETSDK1147), not
      # just renders broken.
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Build for browser-wasm
        run: dotnet build Flower.Web/Flower.Web.csproj --configuration Release
