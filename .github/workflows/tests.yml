name: Tests

on:
  push:

jobs:
  # One leg per platform the app runs on. `os` is the platform, which is what
  # the job is named for; `runner` is the machine it runs on, which for the two
  # phones is not the same thing - iOS runs on a Mac's simulator, and Android
  # is built on Linux.
  #
  # The desktops build, test and decode-check, and test the server, which runs
  # on all three. The decode checks used to be a second job with the same
  # three-OS matrix, duplicating this one's checkout and restore, because they
  # needed a VLC install that a package mirror could fail on its own. With
  # LibVLC gone they are simply another filter of an assembly this job has
  # already built, so the duplicate runner has no reason to exist. They get a
  # step of their own anyway, so a run shows them per platform rather than
  # folded invisibly into the suite.
  #
  # iOS runs the same suite on the iOS runtime, and Android is build-only - its
  # decode checks are local-only for now, see CLAUDE.md, "Device Checks".
  test:
    name: ${{ matrix.job }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { job: test,  os: ubuntu-latest,  runner: ubuntu-latest,  desktop: true }
          - { job: test,  os: windows-latest, runner: windows-latest, desktop: true }
          - { job: test,  os: macos-latest,   runner: macos-latest,   desktop: true }
          - { job: test,  os: ios-latest,     runner: macos-latest,   desktop: false }
          - { job: build, os: android-latest, runner: ubuntu-latest,  desktop: false }
    runs-on: ${{ matrix.runner }}

    steps:
      # Full history, so MinVer sees the tags and commit height it versions
      # these binaries from. actions/checkout defaults to depth 1, which
      # silently yields MinVer's 0.0.0-alpha.0 fallback instead.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Flower.csproj (the shared library Flower.Tests references) targets
      # net10.0 only. This comment previously claimed it multi-targeted
      # net10.0;net9.0, which has not been true for some time - see
      # ARCHITECTURE-REVIEW Tier 5.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Flower/Flower.csproj
            Tests/Flower.Tests/Flower.Tests.csproj
            Flower.Server/Flower.Server.csproj
            Tests/Flower.Server.Tests/Flower.Server.Tests.csproj
            Tests/Flower.Tests.iOS/Flower.Tests.iOS.csproj
            Flower.Android/Flower.Android.csproj

      # The whole suite, RequiresFfmpeg included - the only filter is the decode
      # checks, split into the next step. This used to exclude the
      # RequiresLibVLC tests, because no hosted runner image ships VLC and
      # installing it was flaky enough to be worth keeping out of the fast
      # suite. There is no VLC any more: the one decoder is ffaudio, restored
      # from the FFAudio.NET packages, and everything that decodes for real
      # needs only that.
      #
      # FLOWER_REQUIRE_DECODERS is what stops this going green having checked
      # nothing. A façade that would not load otherwise just makes DecodeChecks
      # report an empty decoder list and every check quietly not happen - which
      # is the exact failure this whole area keeps hitting.
      - name: Run tests
        if: matrix.desktop
        env:
          FLOWER_REQUIRE_DECODERS: FFmpeg
        run: dotnet test Tests/Flower.Tests/Flower.Tests.csproj --configuration Release --filter 'FullyQualifiedName!~DeviceChecksTests'

      # The same assembly, already built by the step above.
      - name: Run decode checks
        if: matrix.desktop
        env:
          FLOWER_REQUIRE_DECODERS: FFmpeg
        run: dotnet test Tests/Flower.Tests/Flower.Tests.csproj --configuration Release --no-build --filter 'FullyQualifiedName~DeviceChecksTests'

      # Flower.Server was once never compiled by CI at all, let alone tested -
      # Flower.Tests only ever builds Flower -> Flower.Core
      # (ARCHITECTURE-REVIEW Tier 5.1). That is how four entity source files
      # under Flower.Server/Data/ stayed uncommitted - a .gitignore rule matched
      # the source folder on case-insensitive filesystems - without anyone
      # noticing the server could not build from a clean checkout.
      #
      # It used to be a job of its own, on Linux only. It runs here instead
      # because the server is supported on all three desktops, and the bug that
      # created it was a case-insensitive filesystem - which is macOS and
      # Windows, the two platforms that job never ran on.
      - name: Run server tests
        if: matrix.desktop
        run: dotnet test Tests/Flower.Server.Tests/Flower.Server.Tests.csproj --configuration Release

      # Flower.Desktop is the one project no test job reaches - the test jobs
      # get to Flower/Flower.Core through Flower.Tests, and the server through
      # its own tests - so without this nothing would ever compile it, and a
      # project CI never compiles is a project that silently rots.
      #
      # It rides along in this job rather than owning one because everything
      # it needs is already restored and built here by the time the tests have
      # run; all that is left is the thin head itself. Linux only, and that is
      # not a gap: Flower.Desktop targets plain net10.0, so the Windows and
      # macOS compiles of it would be the same compile. Running it on all
      # three would cost three times as much for no additional signal.
      #
      # After the tests rather than before, so a compile break in the head
      # never delays the answer to the question this job is mostly asked.
      - name: Build Flower.Desktop
        if: matrix.os == 'ubuntu-latest'
        run: dotnet build Flower.Desktop/Flower.Desktop.csproj --configuration Release

      # The test suite, on an actual iOS runtime.
      #
      # This asks "does this work" of the one platform where the answer has
      # twice been no while every desktop said yes: VLC's mp4 demuxer refusing
      # an unseekable stream, then .NET's mobile HttpClientHandler having no
      # synchronous path at all. Both were invisible to a green desktop suite
      # and both were found by a person listening to a phone.
      #
      # Flower.Tests, unchanged: Flower.Tests.iOS is an app that references it
      # and runs xunit in-process, so what differs from the desktop legs is
      # exactly the platform - Mono with no JIT, a sandboxed filesystem, the iOS
      # builds of ffaudio, miniaudio and Skia. The decode checks are part of the
      # suite (DeviceChecksTests), so this replaced the job that ran only those.
      #
      # The app writes a transcript into its own Documents container, and
      # scripts/ios-tests.sh boots a simulator, installs it, waits for the tally
      # and turns it into an exit code. MusicListViewGestureTests are left out
      # because they alone took seventeen minutes - see
      # Flower.Tests.iOS/AppDelegate.cs.
      - name: Install iOS workload
        if: matrix.os == 'ios-latest'
        run: dotnet workload install ios

      # Flower.Tests.iOS targets net10.0-ios26.5, same as Flower.iOS, so it
      # hits the same _ValidateXcodeVersion equality check that build-apple
      # disables - see the long note there. The script takes no build
      # arguments, but MSBuild reads environment variables as properties, so
      # this reaches its `dotnet build` unchanged.
      #
      # The script's `rm -rf obj bin` costs nothing on a fresh runner; it is
      # there for a developer's incremental build, which reliably launches
      # into a Mono AOT crash that reads exactly like a failing test.
      - name: Run tests on a simulator
        if: matrix.os == 'ios-latest'
        env:
          ValidateXcodeVersion: 'false'
        run: scripts/ios-tests.sh

      - name: Install Android workload
        if: matrix.os == 'android-latest'
        run: dotnet workload install android

      - name: Build for Android
        if: matrix.os == 'android-latest'
        run: dotnet build Flower.Android/Flower.Android.csproj --configuration Release

  # Both Apple heads in one job. They share a runner because the macOS
  # runners are the scarce and expensive ones, and the second head is a few
  # seconds of compile on top of a checkout, restore and workload install that
  # have already been paid for.
  build-apple:
    runs-on: macos-latest

    steps:
      # Full history, so MinVer sees the tags and commit height it versions
      # these binaries from. actions/checkout defaults to depth 1, which
      # silently yields MinVer's 0.0.0-alpha.0 fallback instead.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Flower/Flower.csproj
            Flower.iOS/Flower.iOS.csproj
            Flower.MacOS/Flower.MacOS.csproj

      - name: Install iOS and macOS workloads
        run: dotnet workload install ios macos

      # Build-only: this catches the app head's compile breaks. What runs on
      # the iOS runtime is test (ios-latest), which runs the whole suite there.
      #
      # ValidateXcodeVersion=false is what keeps this job at a couple of
      # minutes instead of fifteen, and the chain behind it is worth writing
      # down because none of it is visible from here.
      #
      # Flower.iOS targets net10.0-ios26.5, which selects the
      # Microsoft.iOS.Sdk.net10.0_26.5 pack, whose _RecommendedXcodeVersion is
      # 26.6. Xamarin.Shared.Sdk.targets' _ValidateXcodeVersion compares
      # major.minor for *equality*, not "at least" - so the build accepts
      # Xcode 26.6.x and nothing else, whichever side of the runner image's
      # default that lands on. This job used to pin it, and then had to spend ~10-15 minutes
      # on `xcodebuild -downloadPlatform iOS` for every single push, because
      # the image's preinstalled simulator runtimes are matched to its newer
      # default Xcodes and actool will not compile an asset catalog without a
      # matching one (actions/runner-images#13317). A multi-gigabyte download,
      # uncached, to satisfy a version equality check.
      #
      # Turning the check off lets the runner use its own default Xcode, whose
      # runtime is already installed, and nothing is skipped: the asset
      # catalog still compiles, so this still builds what it always built.
      # What it gives up is the guarantee that the Xcode underneath is the one
      # Microsoft blessed for this pack - acceptable for a gate that exists to
      # catch compile breaks, and not something to carry into a build that
      # ships. The TFM has since moved (26.0 -> 26.5, to match the Xcode a
      # developer mac actually has), which changes nothing here: the check
      # wants exact equality in both directions, so any TFM is one image
      # update away from disagreeing with the runner's default Xcode again.
      - name: Build for iOS simulator
        run: dotnet build Flower.iOS/Flower.iOS.csproj --configuration Release -p:RuntimeIdentifier=iossimulator-arm64 -p:ValidateXcodeVersion=false

      # Flower.MacOS is the only head that cannot be compiled anywhere but a
      # mac, and until now nothing compiled it at all. Flower.Desktop still
      # runs on macOS, but as plain net10.0 - which is exactly the point of
      # this head: net10.0-macos is what puts AVKit/AppKit in reach, so every
      # Apple-framework call in the app is code that only this build can check.
      #
      # No ValidateXcodeVersion=false here, deliberately, even though this head
      # hits the same check. Flower.MacOS's TFM is unversioned (net10.0-macos),
      # so it takes whatever macOS pack the SDK ships - 26.5 today - which wants
      # Xcode 26.6. On iOS that check is a formality and turning it off costs
      # nothing. Here it is load-bearing: with the check disabled the build gets
      # as far as ILLink and fails with MM0179, needing the macOS 26.5 SDK
      # headers for real. Disabling it would only trade a clear message for an
      # obscure one.
      #
      # So this job is honest about the toolchain it needs, and if the runner's
      # default Xcode is behind that pack it will say so out loud - which is
      # true information, since a head that cannot be built is a head that
      # cannot ship. It cannot be built on a developer mac one Xcode release
      # behind either, which is how it went uncompiled long enough for CI never
      # to have covered it.
      - name: Build Flower.MacOS
        run: dotnet build Flower.MacOS/Flower.MacOS.csproj --configuration Release

      # The decode-checks runner no job runs any more - test (ios-latest) runs the same
      # checks inside the suite - but it is still the one to put on a physical
      # phone (no Avalonia, a two-minute build, readable on screen with no
      # cable), and a project CI never compiles is a project that silently
      # rots. So it is compiled here, where the workload is already installed.
      - name: Build Flower.DeviceChecks.iOS
        run: dotnet build Tests/Flower.DeviceChecks.iOS/Flower.DeviceChecks.iOS.csproj --configuration Release -p:ValidateXcodeVersion=false

  build-web:
    runs-on: ubuntu-latest

    steps:
      # Full history, so MinVer sees the tags and commit height it versions
      # these binaries from. actions/checkout defaults to depth 1, which
      # silently yields MinVer's 0.0.0-alpha.0 fallback instead.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Flower/Flower.csproj
            Flower.Web/Flower.Web.csproj

      # WasmBuildNative (see Flower.Web.csproj) needs wasm-tools' Emscripten
      # toolchain to statically link libSkiaSharp/libHarfBuzzSharp into the
      # WASM bundle - without it the build fails outright (NETSDK1147), not
      # just renders broken.
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Build for browser-wasm
        run: dotnet build Flower.Web/Flower.Web.csproj --configuration Release

  # The server image, built and pushed to GHCR - on a `v*` tag only, and only
  # once everything above it is green.
  #
  # It lives in this workflow rather than one of its own because that is the
  # only way it can wait. Tag pushes fire every `on: push` workflow at once, so
  # a separate publish workflow had no relationship to this one at all: it
  # signed in, built both architectures and pushed `latest` in about five
  # minutes, while the suite that decides whether the commit works was still a
  # quarter of an hour from finishing. v0.2.0 published an image off a tree
  # whose macOS, Windows and Android-emulator jobs all went on to fail.
  # `needs` is the gate, and `needs` only reaches jobs in the same workflow.
  #
  # Every job is listed, deliberately, including the ones a server image does
  # not contain. A tag is a claim about the whole commit - if the phone heads
  # do not build or a test fails on a simulator, that is not a commit anyone
  # should be able to `docker pull`.
  #
  # The image used to be built on every push as well, by a job of its own, so
  # that a change breaking the Dockerfile surfaced then rather than as "the
  # release produced no image". That was dropped as not worth a job on every
  # push: a broken image now shows up here, at the tag.
  image:
    name: Build and publish Docker image
    needs:
      - test
      - build-apple
      - build-web
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    # Scoped to this job rather than the workflow: every other job here needs
    # nothing but the checkout, and this is the only one handed a token that
    # can write packages.
    permissions:
      contents: read
      packages: write

    steps:
      # Full history, for the same reason as every other job here: the
      # Dockerfile deliberately keeps .git in the build context so MinVer can
      # stamp the image from the tags. VERSION below overrides it with the tag
      # itself, so the image's version matches the release exactly.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Both architectures, so arm64 is emulated through QEMU. Cheap anyway:
      # the payload is architecture-neutral IL plus SQLitePCLRaw's runtimes/
      # folder, built once on the build platform, and only the runtime base
      # layer differs between the two.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/yanos/flower-server
          # A stable v1.2.3 tag publishes 1.2.3, 1.2, 1, and latest. A
          # prerelease only publishes its full version; major-zero releases do
          # not create a misleading floating `0` tag.
          tags: |
            type=semver,pattern={{version}},priority=1000
            type=semver,pattern={{major}}.{{minor}},priority=900
            type=semver,pattern={{major}},priority=800,enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,priority=700,enable=${{ !contains(github.ref_name, '-') }}
          flavor: |
            latest=false

      # amd64 first, loaded into the daemon rather than pushed, so the step
      # below can look inside it before anything leaves the runner. The push
      # after it takes this half back out of the cache.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: flower-server:ci
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The browser UI is built into the image by Flower.Server's own targets,
      # which copy the bundle *if* the Emscripten toolchain is present and say
      # nothing at all when it is not (see "The browser UI" in
      # Flower.Server.csproj, and _BuildFlowerWebUi's condition on
      # @(_EmscriptenPack)). So an image whose `dotnet workload install
      # wasm-tools` quietly stopped working still builds, still runs, still
      # serves the API, and serves WebUiHosting's "not deployed" placeholder to
      # anyone opening the settings page - with nothing anywhere reporting a
      # failure. A green build is therefore not enough on its own; this asserts
      # the bundle actually landed where WebUiHosting looks for it, before the
      # image is published rather than after.
      - name: Check the browser UI is in the image
        run: |
          docker run --rm --entrypoint sh flower-server:ci \
            -c 'test -s /app/wwwroot/index.html' \
            || { echo "::error::/app/wwwroot/index.html is missing - the wasm-tools build was skipped, so this image would serve the 'not deployed' placeholder"; exit 1; }

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
