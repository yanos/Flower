name: Tests

on:
  push:

jobs:
  # Build, test and decode-check, once per desktop platform.
  #
  # The decode checks used to be a second job with the same three-OS matrix,
  # duplicating this one's checkout, restore and flower-ffmpeg build, because
  # they needed a VLC install that a package mirror could fail on its own. With
  # LibVLC gone they are simply another filter of an assembly this job has
  # already built, so the duplicate runner has no reason to exist.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      # Full history, so MinVer sees the tags and commit height it versions
      # these binaries from. actions/checkout defaults to depth 1, which
      # silently yields MinVer's 0.0.0-alpha.0 fallback instead.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Flower.csproj (the shared library Flower.Tests references) targets
      # net10.0 only. This comment previously claimed it multi-targeted
      # net10.0;net9.0, which has not been true for some time - see
      # ARCHITECTURE-REVIEW Tier 5.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Flower/Flower.csproj
            Flower.Tests/Flower.Tests.csproj

      # The RequiresFfmpeg tests fail rather than skip without the façade -
      # deliberately, since a decoder silently not under test is the failure
      # mode this whole area keeps hitting - so every platform builds it. That
      # is new for Windows, which used to filter those tests out by name for
      # want of a façade to run them against.
      - name: Build flower-ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libavformat-dev libavcodec-dev libavutil-dev libswresample-dev
          native/ffmpeg/linux/build.sh

      - name: Build flower-ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg
          native/ffmpeg/macos/build.sh

      # Windows has neither an FFmpeg to find nor a pkg-config to ask, so its
      # script downloads a published LGPL build instead of compiling one - see
      # native/ffmpeg/windows/build.ps1. That is why this step is a one-liner
      # where the mobile equivalents would be tens of minutes, and why the
      # RequiresFfmpeg tests are no longer filtered out below.
      - name: Build flower-ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: ./native/ffmpeg/windows/build.ps1
        shell: pwsh

      # No filter. This used to exclude the RequiresLibVLC tests, because no
      # hosted runner image ships VLC and installing it was flaky enough to be
      # worth keeping out of the fast suite. There is no VLC any more: the one
      # decoder is flower-ffmpeg, built two steps up, and everything that
      # decodes for real needs only that.
      #
      # FLOWER_REQUIRE_DECODERS is what stops this going green having checked
      # nothing. A facade that did not build, or built and would not load,
      # otherwise just makes DecodeChecks report an empty decoder list and
      # every check quietly not happen - which is the exact failure this whole
      # area keeps hitting.
      - name: Run tests
        env:
          FLOWER_REQUIRE_DECODERS: FFmpeg
        run: dotnet test Flower.Tests/Flower.Tests.csproj --configuration Release

      # Flower.Desktop is the one project no test job reaches - the test jobs
      # get to Flower/Flower.Core through Flower.Tests, and the server through
      # its own tests - so without this nothing would ever compile it, and a
      # project CI never compiles is a project that silently rots.
      #
      # It rides along in this job rather than owning one because everything
      # it needs is already restored and built here by the time the tests have
      # run; all that is left is the thin head itself. Linux only, and that is
      # not a gap: Flower.Desktop targets plain net10.0, so the Windows and
      # macOS compiles of it would be the same compile. Running it on all
      # three would cost three times as much for no additional signal.
      #
      # After the tests rather than before, so a compile break in the head
      # never delays the answer to the question this job is mostly asked.
      - name: Build Flower.Desktop
        if: runner.os == 'Linux'
        run: dotnet build Flower.Desktop/Flower.Desktop.csproj --configuration Release

  server-test:
    runs-on: ubuntu-latest

    steps:
      # Full history, so MinVer sees the tags and commit height it versions
      # these binaries from. actions/checkout defaults to depth 1, which
      # silently yields MinVer's 0.0.0-alpha.0 fallback instead.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Flower.Core/Flower.Core.csproj
            Flower.Server/Flower.Server.csproj
            Flower.Server.Tests/Flower.Server.Tests.csproj

      # Flower.Server was previously never compiled by CI at all, let alone
      # tested - `dotnet test Flower.Tests` only ever builds
      # Flower.Tests -> Flower -> Flower.Core (ARCHITECTURE-REVIEW Tier 5.1).
      # That is how four entity source files under Flower.Server/Data/ stayed
      # uncommitted (a .gitignore rule matched the source folder on
      # case-insensitive filesystems) without anyone noticing the server could
      # not build from a clean checkout - which is exactly what this job does.
      - name: Run server tests
        run: dotnet test Flower.Server.Tests/Flower.Server.Tests.csproj --configuration Release

  # Both Apple heads in one job. They share a runner because the macOS
  # runners are the scarce and expensive ones, and the second head is a few
  # seconds of compile on top of a checkout, restore and workload install that
  # have already been paid for.
  build-apple:
    runs-on: macos-latest

    steps:
      # Full history, so MinVer sees the tags and commit height it versions
      # these binaries from. actions/checkout defaults to depth 1, which
      # silently yields MinVer's 0.0.0-alpha.0 fallback instead.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Flower/Flower.csproj
            Flower.iOS/Flower.iOS.csproj
            Flower.MacOS/Flower.MacOS.csproj

      - name: Install iOS and macOS workloads
        run: dotnet workload install ios macos

      # Build-only: Flower.Tests has no iOS-specific code, so there's nothing
      # for an on-simulator test run to exercise that this doesn't already
      # cover - this just catches platform-specific compile breaks.
      #
      # ValidateXcodeVersion=false is what keeps this job at a couple of
      # minutes instead of fifteen, and the chain behind it is worth writing
      # down because none of it is visible from here.
      #
      # Flower.iOS targets net10.0-ios26.0, which selects the
      # Microsoft.iOS.Sdk.net10.0_26.0 pack, whose _RecommendedXcodeVersion is
      # 26.0. Xamarin.Shared.Sdk.targets' _ValidateXcodeVersion compares
      # major.minor for *equality*, not "at least" - so the build refused
      # anything but Xcode 26.0.x, which is older than the runner image's
      # default. This job used to pin it, and then had to spend ~10-15 minutes
      # on `xcodebuild -downloadPlatform iOS` for every single push, because
      # the image's preinstalled simulator runtimes are matched to its newer
      # default Xcodes and actool will not compile an asset catalog without a
      # matching one (actions/runner-images#13317). A multi-gigabyte download,
      # uncached, to satisfy a version equality check.
      #
      # Turning the check off lets the runner use its own default Xcode, whose
      # runtime is already installed, and nothing is skipped: the asset
      # catalog still compiles, so this still builds what it always built.
      # What it gives up is the guarantee that the Xcode underneath is the one
      # Microsoft blessed for this pack - acceptable for a gate that exists to
      # catch compile breaks, and not something to carry into a build that
      # ships. Bumping the TFM instead would fix it only until GitHub next
      # moves the image's default Xcode, since the check wants exact equality
      # in both directions.
      - name: Build for iOS simulator
        run: dotnet build Flower.iOS/Flower.iOS.csproj --configuration Release -p:RuntimeIdentifier=iossimulator-arm64 -p:ValidateXcodeVersion=false

      # Flower.MacOS is the only head that cannot be compiled anywhere but a
      # mac, and until now nothing compiled it at all. Flower.Desktop still
      # runs on macOS, but as plain net10.0 - which is exactly the point of
      # this head: net10.0-macos is what puts AVKit/AppKit in reach, so every
      # Apple-framework call in the app is code that only this build can check.
      #
      # No ValidateXcodeVersion=false here, deliberately, even though this head
      # hits the same check. Flower.MacOS's TFM is unversioned (net10.0-macos),
      # so it takes whatever macOS pack the SDK ships - 26.5 today - which wants
      # Xcode 26.6. On iOS that check is a formality and turning it off costs
      # nothing. Here it is load-bearing: with the check disabled the build gets
      # as far as ILLink and fails with MM0179, needing the macOS 26.5 SDK
      # headers for real. Disabling it would only trade a clear message for an
      # obscure one.
      #
      # So this job is honest about the toolchain it needs, and if the runner's
      # default Xcode is behind that pack it will say so out loud - which is
      # true information, since a head that cannot be built is a head that
      # cannot ship. It cannot be built on a developer mac one Xcode release
      # behind either, which is how it went uncompiled long enough for CI never
      # to have covered it.
      - name: Build Flower.MacOS
        run: dotnet build Flower.MacOS/Flower.MacOS.csproj --configuration Release

  # The decode checks, on an actual iOS runtime.
  #
  # decode-checks answers "does this platform turn a track into the right
  # audio" for the three desktops. This asks the same question of the one
  # platform where the answer has twice been no: VLC's mp4 demuxer refusing an
  # unseekable stream, then .NET's mobile HttpClientHandler having no
  # synchronous path at all. Both were invisible to a green desktop suite and
  # both were found by a person listening to a phone.
  #
  # Nothing here is new machinery - Flower.DeviceChecks.iOS and
  # scripts/ios-device-checks.sh already existed and were already written to
  # be driven by a script rather than read by a human: the app writes a
  # transcript into its own Documents container, the script boots a simulator,
  # installs it, waits up to 180s for a tally and turns that into an exit
  # code. The simulator frameworks it links are committed under
  # Flower.iOS/Frameworks/, so there is nothing for this job to install beyond
  # the workload.
  #
  # It runs on every push rather than on master or a schedule. Work in this
  # repo happens on master directly, so a branch gate would save nothing, and
  # a check that only runs nightly finds a phone bug the morning after the
  # commit that caused it has been built on top of.
  ios-device-checks:
    name: Decode checks (iOS Simulator)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Flower/Flower.csproj
            Flower.DeviceChecks.iOS/Flower.DeviceChecks.iOS.csproj

      - name: Install iOS workload
        run: dotnet workload install ios

      # Flower.DeviceChecks.iOS targets net10.0-ios26.0, same as Flower.iOS,
      # so it hits the same _ValidateXcodeVersion equality check that
      # build-apple disables - see the long note there. The script takes no
      # build arguments, but MSBuild reads environment variables as
      # properties, so this reaches its `dotnet build` unchanged.
      #
      # The script's `rm -rf obj bin` costs nothing on a fresh runner; it is
      # there for a developer's incremental build, which reliably launches
      # into a Mono AOT crash that reads exactly like a failing check.
      - name: Run the decode checks on a simulator
        env:
          ValidateXcodeVersion: 'false'
        run: scripts/ios-device-checks.sh

  build-android:
    runs-on: ubuntu-latest

    steps:
      # Full history, so MinVer sees the tags and commit height it versions
      # these binaries from. actions/checkout defaults to depth 1, which
      # silently yields MinVer's 0.0.0-alpha.0 fallback instead.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Flower/Flower.csproj
            Flower.Android/Flower.Android.csproj

      - name: Install Android workload
        run: dotnet workload install android

      - name: Build for Android
        run: dotnet build Flower.Android/Flower.Android.csproj --configuration Release

  build-web:
    runs-on: ubuntu-latest

    steps:
      # Full history, so MinVer sees the tags and commit height it versions
      # these binaries from. actions/checkout defaults to depth 1, which
      # silently yields MinVer's 0.0.0-alpha.0 fallback instead.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Flower/Flower.csproj
            Flower.Web/Flower.Web.csproj

      # WasmBuildNative (see Flower.Web.csproj) needs wasm-tools' Emscripten
      # toolchain to statically link libSkiaSharp/libHarfBuzzSharp into the
      # WASM bundle - without it the build fails outright (NETSDK1147), not
      # just renders broken.
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Build for browser-wasm
        run: dotnet build Flower.Web/Flower.Web.csproj --configuration Release
