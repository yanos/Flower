name: Tests

on:
  push:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      # Full history, so MinVer sees the tags and commit height it versions
      # these binaries from. actions/checkout defaults to depth 1, which
      # silently yields MinVer's 0.0.0-alpha.0 fallback instead.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Flower.csproj (the shared library Flower.Tests references) targets
      # net10.0 only. This comment previously claimed it multi-targeted
      # net10.0;net9.0, which has not been true for some time - see
      # ARCHITECTURE-REVIEW Tier 5.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Flower/Flower.csproj
            Flower.Tests/Flower.Tests.csproj

      # None of the hosted runner images ship VLC, so RequiresLibVLC-tagged
      # tests (real-decode/native-audio coverage) don't run here - same
      # "fast, day-to-day" filter as CLAUDE.md's local dev instructions.
      - name: Run tests
        run: dotnet test Flower.Tests/Flower.Tests.csproj --configuration Release --filter Category!=RequiresLibVLC

  server-test:
    runs-on: ubuntu-latest

    steps:
      # Full history, so MinVer sees the tags and commit height it versions
      # these binaries from. actions/checkout defaults to depth 1, which
      # silently yields MinVer's 0.0.0-alpha.0 fallback instead.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Flower.Core/Flower.Core.csproj
            Flower.Server/Flower.Server.csproj
            Flower.Server.Tests/Flower.Server.Tests.csproj

      # Flower.Server was previously never compiled by CI at all, let alone
      # tested - `dotnet test Flower.Tests` only ever builds
      # Flower.Tests -> Flower -> Flower.Core (ARCHITECTURE-REVIEW Tier 5.1).
      # That is how four entity source files under Flower.Server/Data/ stayed
      # uncommitted (a .gitignore rule matched the source folder on
      # case-insensitive filesystems) without anyone noticing the server could
      # not build from a clean checkout - which is exactly what this job does.
      - name: Run server tests
        run: dotnet test Flower.Server.Tests/Flower.Server.Tests.csproj --configuration Release

  # Flower.Desktop is the one project the jobs above never compile - the test
  # jobs reach Flower/Flower.Core through Flower.Tests, and the server through
  # its own tests. A build-only gate, deliberately: a project CI never compiles
  # is a project that silently rots.
  build-desktop:
    runs-on: ubuntu-latest

    steps:
      # Full history, so MinVer sees the tags and commit height it versions
      # these binaries from. actions/checkout defaults to depth 1, which
      # silently yields MinVer's 0.0.0-alpha.0 fallback instead.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Flower/Flower.csproj
            Flower.Desktop/Flower.Desktop.csproj

      - name: Build Flower.Desktop
        run: dotnet build Flower.Desktop/Flower.Desktop.csproj --configuration Release

  build-ios:
    runs-on: macos-latest

    steps:
      # Full history, so MinVer sees the tags and commit height it versions
      # these binaries from. actions/checkout defaults to depth 1, which
      # silently yields MinVer's 0.0.0-alpha.0 fallback instead.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # macos-latest defaults to a newer Xcode than the .NET for iOS
      # workload supports (it requires an exact major.minor match); the
      # runner image ships older Xcodes side-by-side, so pin to one that
      # matches. Bump this alongside the iOS workload/SDK version.
      - name: Select Xcode 26.0.1
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer

      # The runner image's preinstalled simulator runtimes are matched to
      # its newer default Xcode versions, not 26.0.1, so actool's asset
      # catalog compile fails ("No simulator runtime version ... available
      # to use with iphonesimulator SDK version ...") without this - see
      # actions/runner-images#13317. Costs ~10-15 min but is the workaround
      # maintainers point to for this exact mismatch.
      - name: Install matching iOS simulator runtime
        run: sudo xcodebuild -downloadPlatform iOS

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Flower/Flower.csproj
            Flower.iOS/Flower.iOS.csproj

      - name: Install iOS workload
        run: dotnet workload install ios

      # Build-only: Flower.Tests has no iOS-specific code, so there's nothing
      # for an on-simulator test run to exercise that this doesn't already
      # cover - this just catches platform-specific compile breaks.
      - name: Build for iOS simulator
        run: dotnet build Flower.iOS/Flower.iOS.csproj --configuration Release -p:RuntimeIdentifier=iossimulator-arm64

  build-android:
    runs-on: ubuntu-latest

    steps:
      # Full history, so MinVer sees the tags and commit height it versions
      # these binaries from. actions/checkout defaults to depth 1, which
      # silently yields MinVer's 0.0.0-alpha.0 fallback instead.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Flower/Flower.csproj
            Flower.Android/Flower.Android.csproj

      - name: Install Android workload
        run: dotnet workload install android

      - name: Build for Android
        run: dotnet build Flower.Android/Flower.Android.csproj --configuration Release

  build-web:
    runs-on: ubuntu-latest

    steps:
      # Full history, so MinVer sees the tags and commit height it versions
      # these binaries from. actions/checkout defaults to depth 1, which
      # silently yields MinVer's 0.0.0-alpha.0 fallback instead.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Flower/Flower.csproj
            Flower.Web/Flower.Web.csproj

      # WasmBuildNative (see Flower.Web.csproj) needs wasm-tools' Emscripten
      # toolchain to statically link libSkiaSharp/libHarfBuzzSharp into the
      # WASM bundle - without it the build fails outright (NETSDK1147), not
      # just renders broken.
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Build for browser-wasm
        run: dotnet build Flower.Web/Flower.Web.csproj --configuration Release
