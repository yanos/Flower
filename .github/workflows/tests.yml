name: Tests

on:
  push:

# Superseded branch runs need not occupy the mobile runners. Tags always finish.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Desktop suites share one restore/build per OS. Mobile/head builds remain
  # independent so their long compiles run in parallel, without sharing obj/.
  # Android decoding tests remain local-only; see CLAUDE.md.
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: test shared, UI, decoding, native and server suites (linux-ubuntu-24.04)
            kind: desktop-test
            runner: ubuntu-24.04
            platform: Linux
          - name: test shared, UI, decoding, native and server suites (windows-2025)
            kind: desktop-test
            runner: windows-2025
            platform: Windows
          - name: test shared, UI, decoding, native and server suites (macos-26)
            kind: desktop-test
            runner: macos-26
            platform: macOS
          - name: test shared, UI and decoding suites (ios-27, Mono)
            kind: ios-test
            runner: xcode-27
          - name: build Flower.MacOS (macos-27)
            kind: macos-build
            runner: xcode-27
          - name: build Flower.iOS, run decode checks with NativeAOT (ios-27)
            kind: ios-build
            runner: xcode-27
          - name: build Flower.Android (android-36)
            kind: android-build
            runner: ubuntu-24.04
          - name: build Flower.Web (browser-wasm)
            kind: web-build
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}

    steps:
      # Full history, so MinVer sees the tags and commit height it versions
      # these binaries from. actions/checkout defaults to depth 1, which
      # silently yields MinVer's 0.0.0-alpha.0 fallback instead.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Flower.csproj (the shared library Flower.Tests references) targets
      # net10.0 only. This comment previously claimed it multi-targeted
      # net10.0;net9.0, which has not been true for some time - see
      # ARCHITECTURE-REVIEW Tier 5.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props
            Tests/ClientTests.props

      # Build the project graph once; each test step then executes its suite
      # without another restore/build. Native tests run only on their own OS.
      - name: Build desktop test suites
        if: matrix.kind == 'desktop-test'
        run: dotnet build Tests/Flower.Desktop.Tests.slnf --configuration Release -p:IncludeWebUi=false

      - name: Run shared behavior tests
        if: matrix.kind == 'desktop-test'
        run: dotnet test Tests/Flower.Tests/Flower.Tests.csproj --configuration Release --no-build

      - name: Run headless UI behavior tests
        if: matrix.kind == 'desktop-test'
        env:
          FLOWER_REQUIRE_DECODERS: FFmpeg
        run: dotnet test Tests/Flower.Tests.UI/Flower.Tests.UI.csproj --configuration Release --no-build

      # Fail rather than pass an empty set of scenarios if the native decoder
      # cannot load. This also applies to the simulator scripts.
      - name: Run decoding tests
        if: matrix.kind == 'desktop-test'
        env:
          FLOWER_REQUIRE_DECODERS: FFmpeg
        run: dotnet test Tests/Flower.Tests.Decoding/Flower.Tests.Decoding.csproj --configuration Release --no-build

      - name: Run native platform tests
        if: matrix.kind == 'desktop-test' && matrix.platform != 'Linux'
        run: dotnet test Tests/Flower.Tests.${{ matrix.platform }}/Flower.Tests.${{ matrix.platform }}.csproj --configuration Release --no-build

      # The server is supported on all three desktops, including the
      # case-insensitive filesystems where a missing-source regression occurred.
      - name: Run server tests
        if: matrix.kind == 'desktop-test'
        run: dotnet test Tests/Flower.Server.Tests/Flower.Server.Tests.csproj --configuration Release --no-build

      # Reuse the Linux checkout, package cache and shared-library build rather
      # than allocating a separate runner to compile this plain net10.0 head.
      - name: Build Flower.Desktop
        if: matrix.kind == 'desktop-test' && matrix.platform == 'Linux'
        run: dotnet build Flower.Desktop/Flower.Desktop.csproj --configuration Release

      # Flower.MacOS is the only head that cannot be compiled anywhere but a
      # mac. Flower.Desktop still runs on macOS, but as plain net10.0 - which is
      # exactly the point of this head: net10.0-macos is what puts AVKit/AppKit
      # in reach, so every Apple-framework call in the app is code that only
      # this build can check.
      #
      # On the xcode-27 image, like the iOS legs: the macOS workload the .NET
      # SDK installs is 27.0, which builds against the macOS 27 SDK for real
      # (MM0179 without its headers) and checks for exactly Xcode 27.0 - and
      # the macos-26 image has no Xcode 27 at all.
      - name: Install macOS workload
        if: matrix.kind == 'macos-build'
        run: dotnet workload install macos

      - name: Build Flower.MacOS
        if: matrix.kind == 'macos-build'
        run: dotnet build Flower.MacOS/Flower.MacOS.csproj --configuration Release

      # The shared, UI and decoding sources are compiled into one suite for
      # the existing Mono iOS runner. One assembly retains the headless session
      # and its global dispatcher. NativeAOT decoding runs separately below;
      # Avalonia.Headless.XUnit does not yet support xUnit's AOT runner.
      #
      # Pinned, workload and Xcode both, to what a developer's Mac builds the
      # phone with: workload set 10.0.402 (iOS 27.0.10722, which
      # net10.0-ios27.0 in the iOS projects names) and Xcode 27.0, which
      # that workload checks for exactly. Unpinned, `dotnet workload install`
      # takes the newest set for the SDK's band, and set 10.0.403 brought iOS
      # 27.1, which refuses 27.0 outright (NETSDK1140) - every iOS leg went red
      # at restore, on a commit that touched nothing iOS. The image keeps
      # 27.0 beside its default 27.1; DEVELOPER_DIR picks it without sudo.
      # Moving to 27.1 is a change to the iOS TFMs, this pin and the
      # developer's Xcode together.
      - name: Install iOS workload
        if: matrix.kind == 'ios-test' || matrix.kind == 'ios-build'
        run: |
          echo "DEVELOPER_DIR=/Applications/Xcode_27.0.app/Contents/Developer" >> "$GITHUB_ENV"
          dotnet workload install ios --version 10.0.402

      # The script's `rm -rf obj bin` costs nothing on a fresh runner; it is
      # there for a developer's incremental build, which used to launch into
      # a Mono AOT crash that reads exactly like a failing test.
      # IOS_SIMULATOR_RUNTIME is what makes "ios-27" in this leg's name true:
      # the script runs on an iOS 27 simulator, and fails rather than quietly
      # picking another when the image has none.
      - name: Run tests on a simulator
        if: matrix.kind == 'ios-test'
        env:
          IOS_SIMULATOR_RUNTIME: '27'
        run: scripts/ios-tests.sh

      # The iOS legs run on the xcode-27 image because the workload wants
      # it: the 27.0 packs (net10.0-ios27.0) check for exactly Xcode 27.0,
      # and the macos-26 image stops at 26.6. It keeps Xcode 27.0 (selected by
      # the workload step above; its default is now 27.1) with the matching
      # iOS 27.0 simulator runtime preinstalled - the pairing that once
      # cost a ~10-15 minute `xcodebuild -downloadPlatform iOS` per push when
      # a pinned Xcode and the image's runtimes disagreed
      # (actions/runner-images#13317). The image is still a preview, so its
      # capacity can queue a leg that macos-26 would have started at once.
      #
      # Signed ad hoc (CodesignKey=-), because the runner has no signing
      # identity and Flower.iOS carries a real entitlement - the Keychain group
      # KeychainSecureStore needs - which a simulator build still has to sign
      # in. An empty Entitlements.plist needed no signature at all, which is
      # why this only started failing when the group was added.
      #
      # On NativeAOT, the runtime the app ships on (scripts/deploy-ios-device.sh,
      # FlowerNativeAot in Flower.iOS.csproj). The SDK compiles NativeAOT only on
      # its publish path and refuses to publish for a simulator, so this is a
      # build told it is publishing (_IsPublishing) - the same compile, trim
      # and link a phone gets, for the simulator's architecture.
      - name: Build Flower.iOS
        if: matrix.kind == 'ios-build'
        run: dotnet build Flower.iOS/Flower.iOS.csproj --configuration Release -p:RuntimeIdentifier=iossimulator-arm64 -p:CodesignKey=- -p:FlowerNativeAot=true -p:_IsPublishing=true

      # The decode checks, on NativeAOT on a simulator: the iOS test leg runs
      # the same checks inside the suite, but on Mono (see above), and NativeAOT
      # is where a P/Invoke that will not resolve or a type the trimmer took
      # away shows up - the first NativeAOT launch on a phone died on exactly
      # the former. It is also the runner to put on a physical phone (no
      # Avalonia, readable on screen with no cable), so running it here keeps
      # it from rotting as well.
      - name: Run decode checks on a simulator
        if: matrix.kind == 'ios-build'
        env:
          IOS_SIMULATOR_RUNTIME: '27'
        run: scripts/ios-decoding-tests.sh

      - name: Install Android workload
        if: matrix.kind == 'android-build'
        run: dotnet workload install android

      - name: Build for Android
        if: matrix.kind == 'android-build'
        run: dotnet build Flower.Android/Flower.Android.csproj --configuration Release

      - name: Build Android decoding test runner
        if: matrix.kind == 'android-build'
        run: dotnet build Tests/Flower.Tests.Decoding.Android/Flower.Tests.Decoding.Android.csproj --configuration Release

      # WasmBuildNative (see Flower.Web.csproj) needs wasm-tools' Emscripten
      # toolchain to statically link libSkiaSharp/libHarfBuzzSharp into the
      # WASM bundle - without it the build fails outright (NETSDK1147), not
      # just renders broken.
      - name: Install wasm-tools workload
        if: matrix.kind == 'web-build'
        run: dotnet workload install wasm-tools

      - name: Build for browser-wasm
        if: matrix.kind == 'web-build'
        run: dotnet build Flower.Web/Flower.Web.csproj --configuration Release

  # The desktop installers - a dmg, an AppImage and a Setup.exe - on a `v*` tag
  # only, built by scripts/package-desktop.sh (whose header says what each one
  # is and why none is signed). One runner per OS, because the FFmpeg payload
  # follows the host and Velopack cannot cross-pack an AppImage without tools
  # a Mac lacks; and in parallel with the suite rather than after it, since
  # nothing is published until `release` below has both.
  #
  # Like the image, these are built on tags only, so a change that breaks
  # packaging surfaces at the release. The script runs the same by hand, on
  # the OS in question, to check one before tagging.
  installers:
    name: ${{ matrix.name }}
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: package Flower.MacOS as a dmg (macos-27)
            kind: dmg
            runner: xcode-27
          - name: package Flower.Desktop as an AppImage (linux-ubuntu-24.04)
            kind: appimage
            runner: ubuntu-24.04
          - name: package Flower.Desktop as a Setup.exe (windows-2025)
            kind: setup
            runner: windows-2025
    runs-on: ${{ matrix.runner }}

    steps:
      # Full history: the version in each file name and assembly is MinVer's,
      # read from the tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Flower/Flower.csproj
            Flower.Desktop/Flower.Desktop.csproj
            Flower.MacOS/Flower.MacOS.csproj

      # On the xcode-27 image for the same reason as the macos-build leg: the
      # 27.0 workload wants exactly Xcode 27.
      - name: Install macOS workload
        if: matrix.kind == 'dmg'
        run: dotnet workload install macos

      # vpk builds the AppImage's filesystem with mksquashfs, which the image
      # does not carry.
      - name: Install squashfs-tools
        if: matrix.kind == 'appimage'
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools

      - name: Package
        shell: bash
        run: scripts/package-desktop.sh ${{ matrix.kind }}

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.kind }}
          path: artifacts/installers/*
          if-no-files-found: error

  # The tag's GitHub release, with the three installers attached, and the
  # Windows and Linux update feeds that installed copies read from the latest
  # stable release (Flower.Desktop's VelopackUpdater; the Mac reads the
  # release itself, GitHubReleaseUpdater). Only once the suite is green and
  # all three were built, for the reason the image job below gives: a tag is
  # a claim about the whole commit.
  release:
    name: Publish the desktop installers
    needs:
      - test
      - installers
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04

    # The only job that can write to the repository, and only to create the
    # release and attach to it.
    permissions:
      contents: write

    steps:
      # Each runner's files in a folder of their own, then gathered here:
      # merging them on download would let one runner's file silently replace
      # another's of the same name, and the Windows and Linux update feeds are
      # only kept apart by vpk naming them by channel.
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: built

      - name: Gather the files
        run: |
          mkdir installers
          duplicates=$(find built -type f -printf '%f\n' | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "::error::two runners built a file of the same name: $duplicates"
            exit 1
          fi
          find built -type f -exec mv {} installers/ \;
          ls -l installers

      # A pre-release tag (v1.2.0-beta.1) makes a pre-release, the same test
      # the image job uses to keep one off `latest`. A re-run finds the
      # release already made and replaces its files rather than failing.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" installers/* --clobber
          else
            gh release create "$TAG" installers/* --title "Flower $TAG" --verify-tag --generate-notes $PRERELEASE \
              --notes "None of the installers is signed yet. On a Mac, open Flower once, then allow it in System Settings > Privacy & Security > Open Anyway (Apple Silicon only). On Windows, SmartScreen asks first: More info > Run anyway."
          fi

  # The server image, built and pushed to GHCR - on a `v*` tag only, and only
  # once everything above it is green.
  #
  # It lives in this workflow rather than one of its own because that is the
  # only way it can wait. Tag pushes fire every `on: push` workflow at once, so
  # a separate publish workflow had no relationship to this one at all: it
  # signed in, built both architectures and pushed `latest` in about five
  # minutes, while the suite that decides whether the commit works was still a
  # quarter of an hour from finishing. v0.2.0 published an image off a tree
  # whose macOS, Windows and Android-emulator jobs all went on to fail.
  # `needs` is the gate, and `needs` only reaches jobs in the same workflow.
  #
  # Every job is listed, deliberately, including the ones a server image does
  # not contain. A tag is a claim about the whole commit - if the phone heads
  # do not build or a test fails on a simulator, that is not a commit anyone
  # should be able to `docker pull`.
  #
  # The image used to be built on every push as well, by a job of its own, so
  # that a change breaking the Dockerfile surfaced then rather than as "the
  # release produced no image". That was dropped as not worth a job on every
  # push: a broken image now shows up here, at the tag.
  image:
    name: Build and publish Docker image
    needs:
      - test
      - installers
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04

    # Scoped to this job rather than the workflow: every other job here needs
    # nothing but the checkout, and this is the only one handed a token that
    # can write packages.
    permissions:
      contents: read
      packages: write

    steps:
      # Full history, for the same reason as every other job here: the
      # Dockerfile deliberately keeps .git in the build context so MinVer can
      # stamp the image from the tags. VERSION below overrides it with the tag
      # itself, so the image's version matches the release exactly.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Both architectures, so arm64 is emulated through QEMU. Cheap anyway:
      # the payload is architecture-neutral IL plus SQLitePCLRaw's runtimes/
      # folder, built once on the build platform, and only the runtime base
      # layer differs between the two.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/yanos/flower-server
          # A stable v1.2.3 tag publishes 1.2.3, 1.2, 1, and latest. A
          # prerelease only publishes its full version; major-zero releases do
          # not create a misleading floating `0` tag.
          tags: |
            type=semver,pattern={{version}},priority=1000
            type=semver,pattern={{major}}.{{minor}},priority=900
            type=semver,pattern={{major}},priority=800,enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,priority=700,enable=${{ !contains(github.ref_name, '-') }}
          flavor: |
            latest=false

      # amd64 first, loaded into the daemon rather than pushed, so the step
      # below can look inside it before anything leaves the runner. The push
      # after it takes this half back out of the cache.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: flower-server:ci
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The browser UI is built into the image by Flower.Server's own targets,
      # which copy the bundle *if* the Emscripten toolchain is present and say
      # nothing at all when it is not (see "The browser UI" in
      # Flower.Server.csproj, and _BuildFlowerWebUi's condition on
      # @(_EmscriptenPack)). So an image whose `dotnet workload install
      # wasm-tools` quietly stopped working still builds, still runs, still
      # serves the API, and serves WebUiHosting's "not deployed" placeholder to
      # anyone opening the settings page - with nothing anywhere reporting a
      # failure. A green build is therefore not enough on its own; this asserts
      # the bundle actually landed where WebUiHosting looks for it, before the
      # image is published rather than after.
      - name: Check the browser UI is in the image
        run: |
          docker run --rm --entrypoint sh flower-server:ci \
            -c 'test -s /app/wwwroot/index.html' \
            || { echo "::error::/app/wwwroot/index.html is missing - the wasm-tools build was skipped, so this image would serve the 'not deployed' placeholder"; exit 1; }

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
