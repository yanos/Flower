name: Tests

on:
  push:

jobs:
  # Build, test and decode-check, once per desktop platform.
  #
  # The decode checks used to be a second job with the same three-OS matrix,
  # duplicating this one's checkout and restore, because they needed a VLC
  # install that a package mirror could fail on its own. With LibVLC gone they
  # are simply another filter of an assembly this job has already built, so
  # the duplicate runner has no reason to exist.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      # Full history, so MinVer sees the tags and commit height it versions
      # these binaries from. actions/checkout defaults to depth 1, which
      # silently yields MinVer's 0.0.0-alpha.0 fallback instead.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Flower.csproj (the shared library Flower.Tests references) targets
      # net10.0 only. This comment previously claimed it multi-targeted
      # net10.0;net9.0, which has not been true for some time - see
      # ARCHITECTURE-REVIEW Tier 5.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Flower/Flower.csproj
            Tests/Flower.Tests/Flower.Tests.csproj

      # No filter. This used to exclude the RequiresLibVLC tests, because no
      # hosted runner image ships VLC and installing it was flaky enough to be
      # worth keeping out of the fast suite. There is no VLC any more: the one
      # decoder is ffaudio, restored from the FFAudio.NET packages, and
      # everything that decodes for real needs only that.
      #
      # FLOWER_REQUIRE_DECODERS is what stops this going green having checked
      # nothing. A façade that would not load otherwise just makes DecodeChecks
      # report an empty decoder list and every check quietly not happen - which is the exact failure this whole
      # area keeps hitting.
      - name: Run tests
        env:
          FLOWER_REQUIRE_DECODERS: FFmpeg
        run: dotnet test Tests/Flower.Tests/Flower.Tests.csproj --configuration Release

      # Flower.Desktop is the one project no test job reaches - the test jobs
      # get to Flower/Flower.Core through Flower.Tests, and the server through
      # its own tests - so without this nothing would ever compile it, and a
      # project CI never compiles is a project that silently rots.
      #
      # It rides along in this job rather than owning one because everything
      # it needs is already restored and built here by the time the tests have
      # run; all that is left is the thin head itself. Linux only, and that is
      # not a gap: Flower.Desktop targets plain net10.0, so the Windows and
      # macOS compiles of it would be the same compile. Running it on all
      # three would cost three times as much for no additional signal.
      #
      # After the tests rather than before, so a compile break in the head
      # never delays the answer to the question this job is mostly asked.
      - name: Build Flower.Desktop
        if: runner.os == 'Linux'
        run: dotnet build Flower.Desktop/Flower.Desktop.csproj --configuration Release

  server-test:
    runs-on: ubuntu-latest

    steps:
      # Full history, so MinVer sees the tags and commit height it versions
      # these binaries from. actions/checkout defaults to depth 1, which
      # silently yields MinVer's 0.0.0-alpha.0 fallback instead.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Flower.Core/Flower.Core.csproj
            Flower.Server/Flower.Server.csproj
            Tests/Flower.Server.Tests/Flower.Server.Tests.csproj

      # Flower.Server was previously never compiled by CI at all, let alone
      # tested - `dotnet test Flower.Tests` only ever builds
      # Flower.Tests -> Flower -> Flower.Core (ARCHITECTURE-REVIEW Tier 5.1).
      # That is how four entity source files under Flower.Server/Data/ stayed
      # uncommitted (a .gitignore rule matched the source folder on
      # case-insensitive filesystems) without anyone noticing the server could
      # not build from a clean checkout - which is exactly what this job does.
      - name: Run server tests
        run: dotnet test Tests/Flower.Server.Tests/Flower.Server.Tests.csproj --configuration Release

  # Both Apple heads in one job. They share a runner because the macOS
  # runners are the scarce and expensive ones, and the second head is a few
  # seconds of compile on top of a checkout, restore and workload install that
  # have already been paid for.
  build-apple:
    runs-on: macos-latest

    steps:
      # Full history, so MinVer sees the tags and commit height it versions
      # these binaries from. actions/checkout defaults to depth 1, which
      # silently yields MinVer's 0.0.0-alpha.0 fallback instead.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Flower/Flower.csproj
            Flower.iOS/Flower.iOS.csproj
            Flower.MacOS/Flower.MacOS.csproj

      - name: Install iOS and macOS workloads
        run: dotnet workload install ios macos

      # Build-only: Flower.Tests has no iOS-specific code, so there's nothing
      # for an on-simulator test run to exercise that this doesn't already
      # cover - this just catches platform-specific compile breaks.
      #
      # ValidateXcodeVersion=false is what keeps this job at a couple of
      # minutes instead of fifteen, and the chain behind it is worth writing
      # down because none of it is visible from here.
      #
      # Flower.iOS targets net10.0-ios26.5, which selects the
      # Microsoft.iOS.Sdk.net10.0_26.5 pack, whose _RecommendedXcodeVersion is
      # 26.6. Xamarin.Shared.Sdk.targets' _ValidateXcodeVersion compares
      # major.minor for *equality*, not "at least" - so the build accepts
      # Xcode 26.6.x and nothing else, whichever side of the runner image's
      # default that lands on. This job used to pin it, and then had to spend ~10-15 minutes
      # on `xcodebuild -downloadPlatform iOS` for every single push, because
      # the image's preinstalled simulator runtimes are matched to its newer
      # default Xcodes and actool will not compile an asset catalog without a
      # matching one (actions/runner-images#13317). A multi-gigabyte download,
      # uncached, to satisfy a version equality check.
      #
      # Turning the check off lets the runner use its own default Xcode, whose
      # runtime is already installed, and nothing is skipped: the asset
      # catalog still compiles, so this still builds what it always built.
      # What it gives up is the guarantee that the Xcode underneath is the one
      # Microsoft blessed for this pack - acceptable for a gate that exists to
      # catch compile breaks, and not something to carry into a build that
      # ships. The TFM has since moved (26.0 -> 26.5, to match the Xcode a
      # developer mac actually has), which changes nothing here: the check
      # wants exact equality in both directions, so any TFM is one image
      # update away from disagreeing with the runner's default Xcode again.
      - name: Build for iOS simulator
        run: dotnet build Flower.iOS/Flower.iOS.csproj --configuration Release -p:RuntimeIdentifier=iossimulator-arm64 -p:ValidateXcodeVersion=false

      # Flower.MacOS is the only head that cannot be compiled anywhere but a
      # mac, and until now nothing compiled it at all. Flower.Desktop still
      # runs on macOS, but as plain net10.0 - which is exactly the point of
      # this head: net10.0-macos is what puts AVKit/AppKit in reach, so every
      # Apple-framework call in the app is code that only this build can check.
      #
      # No ValidateXcodeVersion=false here, deliberately, even though this head
      # hits the same check. Flower.MacOS's TFM is unversioned (net10.0-macos),
      # so it takes whatever macOS pack the SDK ships - 26.5 today - which wants
      # Xcode 26.6. On iOS that check is a formality and turning it off costs
      # nothing. Here it is load-bearing: with the check disabled the build gets
      # as far as ILLink and fails with MM0179, needing the macOS 26.5 SDK
      # headers for real. Disabling it would only trade a clear message for an
      # obscure one.
      #
      # So this job is honest about the toolchain it needs, and if the runner's
      # default Xcode is behind that pack it will say so out loud - which is
      # true information, since a head that cannot be built is a head that
      # cannot ship. It cannot be built on a developer mac one Xcode release
      # behind either, which is how it went uncompiled long enough for CI never
      # to have covered it.
      - name: Build Flower.MacOS
        run: dotnet build Flower.MacOS/Flower.MacOS.csproj --configuration Release

  # The decode checks, on an actual iOS runtime.
  #
  # decode-checks answers "does this platform turn a track into the right
  # audio" for the three desktops. This asks the same question of the one
  # platform where the answer has twice been no: VLC's mp4 demuxer refusing an
  # unseekable stream, then .NET's mobile HttpClientHandler having no
  # synchronous path at all. Both were invisible to a green desktop suite and
  # both were found by a person listening to a phone.
  #
  # Nothing here is new machinery - Flower.DeviceChecks.iOS and
  # scripts/ios-device-checks.sh already existed and were already written to
  # be driven by a script rather than read by a human: the app writes a
  # transcript into its own Documents container, the script boots a simulator,
  # installs it, waits up to 180s for a tally and turns that into an exit
  # code. The simulator frameworks it links are committed under
  # Flower.iOS/Frameworks/ (miniaudio) or restored from FFAudio.NET.iOS
  # (ffaudio), so there is nothing for this job to install beyond the
  # workload.
  #
  # It runs on every push rather than on master or a schedule. Work in this
  # repo happens on master directly, so a branch gate would save nothing, and
  # a check that only runs nightly finds a phone bug the morning after the
  # commit that caused it has been built on top of.
  ios-device-checks:
    name: Decode checks (iOS Simulator)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Flower/Flower.csproj
            Tests/Flower.DeviceChecks.iOS/Flower.DeviceChecks.iOS.csproj

      - name: Install iOS workload
        run: dotnet workload install ios

      # Flower.DeviceChecks.iOS targets net10.0-ios26.5, same as Flower.iOS,
      # so it hits the same _ValidateXcodeVersion equality check that
      # build-apple disables - see the long note there. The script takes no
      # build arguments, but MSBuild reads environment variables as
      # properties, so this reaches its `dotnet build` unchanged.
      #
      # The script's `rm -rf obj bin` costs nothing on a fresh runner; it is
      # there for a developer's incremental build, which reliably launches
      # into a Mono AOT crash that reads exactly like a failing check.
      - name: Run the decode checks on a simulator
        env:
          ValidateXcodeVersion: 'false'
        run: scripts/ios-device-checks.sh

  build-android:
    runs-on: ubuntu-latest

    steps:
      # Full history, so MinVer sees the tags and commit height it versions
      # these binaries from. actions/checkout defaults to depth 1, which
      # silently yields MinVer's 0.0.0-alpha.0 fallback instead.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Flower/Flower.csproj
            Flower.Android/Flower.Android.csproj

      - name: Install Android workload
        run: dotnet workload install android

      - name: Build for Android
        run: dotnet build Flower.Android/Flower.Android.csproj --configuration Release

  android-device-checks:
    name: Decode checks (Android emulator)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Flower/Flower.csproj
            Tests/Flower.DeviceChecks.Android/Flower.DeviceChecks.Android.csproj

      - name: Install Android workload
        run: dotnet workload install android

      # The emulator needs hardware acceleration to be usable rather than
      # merely possible: without KVM an x86_64 image falls back to full
      # emulation and a decode check that takes seconds takes minutes. Ubuntu
      # runners have the device but not the permissions.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The action owns the emulator's lifecycle, so the script is told to use
      # the device it finds rather than start one of its own - two processes
      # fighting over one AVD lock is a failure with no useful error.
      #
      # x86_64 here and arm64-v8a on a developer's Mac: which ABI gets
      # exercised is a property of the host, and FFAudio.NET.Android carries
      # a façade for both.
      - name: Run the decode checks on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: FLOWER_ANDROID_SERIAL=emulator-5554 scripts/android-device-checks.sh

  build-web:
    runs-on: ubuntu-latest

    steps:
      # Full history, so MinVer sees the tags and commit height it versions
      # these binaries from. actions/checkout defaults to depth 1, which
      # silently yields MinVer's 0.0.0-alpha.0 fallback instead.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Flower/Flower.csproj
            Flower.Web/Flower.Web.csproj

      # WasmBuildNative (see Flower.Web.csproj) needs wasm-tools' Emscripten
      # toolchain to statically link libSkiaSharp/libHarfBuzzSharp into the
      # WASM bundle - without it the build fails outright (NETSDK1147), not
      # just renders broken.
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Build for browser-wasm
        run: dotnet build Flower.Web/Flower.Web.csproj --configuration Release

  # The server image, built but not published.
  #
  # The publish below runs on `v*` tags alone - so a change that breaks the
  # image (a moved csproj in the restore layer, a base image that stops
  # carrying something, a workload that stops installing) surfaced as "the
  # release produced no image", at the worst possible moment. This job asks the
  # same question on every push, for about the price of the publish minus the
  # push.
  #
  # linux/amd64 only, and that is not a gap: this is a framework-dependent
  # publish whose payload is architecture-neutral IL plus SQLitePCLRaw's
  # runtimes/ folder, so the arm64 image differs from this one only in its
  # runtime base layer. Building both here would mean QEMU and most of an hour
  # for no new signal; the tag build proves the pair.
  build-image:
    name: Build server image
    runs-on: ubuntu-latest

    steps:
      # Full history, for the same reason as every other job here: the
      # Dockerfile deliberately keeps .git in the build context so MinVer stamps
      # the image from the tags, and a depth-1 checkout would have it silently
      # fall back to 0.1.0-alpha.0. That path is exercised here rather than
      # patched over with the VERSION build-arg the publish workflow needs
      # (which does check out shallow) - between them both halves are covered.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      # Loaded into the daemon rather than discarded, so the step below can look
      # inside it. No QEMU and no registry login: nothing here leaves the runner.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: flower-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The browser UI is built into the image by Flower.Server's own targets,
      # which copy the bundle *if* the Emscripten toolchain is present and say
      # nothing at all when it is not (see "The browser UI" in
      # Flower.Server.csproj, and _BuildFlowerWebUi's condition on
      # @(_EmscriptenPack)). So an image whose `dotnet workload install
      # wasm-tools` quietly stopped working still builds, still runs, still
      # serves the API, and serves WebUiHosting's "not deployed" placeholder to
      # anyone opening the settings page - with nothing anywhere reporting a
      # failure. A green build is therefore not enough on its own; this asserts
      # the bundle actually landed where WebUiHosting looks for it.
      - name: Check the browser UI is in the image
        run: |
          docker run --rm --entrypoint sh flower-server:ci \
            -c 'test -s /app/wwwroot/index.html' \
            || { echo "::error::/app/wwwroot/index.html is missing - the wasm-tools build was skipped, so this image would serve the 'not deployed' placeholder"; exit 1; }

  # The same image, pushed to GHCR - on a `v*` tag, and only once everything
  # above it is green.
  #
  # It lives in this workflow rather than one of its own because that is the
  # only way it can wait. Tag pushes fire every `on: push` workflow at once, so
  # a separate publish workflow had no relationship to this one at all: it
  # signed in, built both architectures and pushed `latest` in about five
  # minutes, while the suite that decides whether the commit works was still a
  # quarter of an hour from finishing. v0.2.0 published an image off a tree
  # whose macOS, Windows and Android-emulator jobs all went on to fail.
  # `needs` is the gate, and `needs` only reaches jobs in the same workflow.
  #
  # Nearly every job is listed, deliberately, including the ones a server image
  # does not contain. A tag is a claim about the whole commit - if the phone
  # heads do not build or a decode check fails on a simulator, that is not a
  # commit anyone should be able to `docker pull`.
  publish-image:
    name: Publish server image to GHCR
    needs:
      - test
      - server-test
      - build-apple
      - ios-device-checks
      - build-android
      # android-device-checks is the one exception, and it is a temporary one.
      # It is knowingly red: Flower.csproj picks a desktop ffaudio payload by
      # host, that flows transitively to the Android heads, and android-x64
      # falls back to linux-x64 in the RID graph - so on a Linux runner the
      # glibc libffaudio.so wins lib/x86_64/ and the real Android one is
      # dropped ("XA4301: APK already contains the item
      # lib/x86_64/libffaudio.so; ignoring"). dlopen then fails on the
      # emulator and the checks report no decoder at all.
      #
      # Listing it here would block every release on a bug that has nothing to
      # do with the server image, so it is left out until the payload is fixed
      # - at which point it belongs back in this list.
      - build-web
      - build-image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    # Scoped to this job rather than the workflow: every other job here needs
    # nothing but the checkout, and this is the only one handed a token that
    # can write packages.
    permissions:
      contents: read
      packages: write

    steps:
      # Shallow, unlike every other job here: MinVer never runs in this one.
      # The Dockerfile's own build stamps the version, and VERSION below hands
      # it the tag directly so the image's version matches the release exactly.
      # build-image covers the other half - a full-history checkout where MinVer
      # derives it from the tags itself.
      - uses: actions/checkout@v4

      # Both architectures, so arm64 is emulated through QEMU - the one thing
      # this job does that build-image does not. The amd64 half comes back out
      # of the gha cache that build-image just filled.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/yanos/flower-server
          # A stable v1.2.3 tag publishes 1.2.3, 1.2, 1, and latest. A
          # prerelease only publishes its full version; major-zero releases do
          # not create a misleading floating `0` tag.
          tags: |
            type=semver,pattern={{version}},priority=1000
            type=semver,pattern={{major}}.{{minor}},priority=900
            type=semver,pattern={{major}},priority=800,enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,priority=700,enable=${{ !contains(github.ref_name, '-') }}
          flavor: |
            latest=false

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
