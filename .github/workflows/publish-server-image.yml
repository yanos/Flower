name: Publish server image

on:
  push:
    tags:
      - "v*"

# The repository-scoped token authenticates the workflow to GHCR. Keep this
# limited to the package permission the publish needs.
permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish Flower.Server to GHCR
    runs-on: ubuntu-latest

    steps:
      # Use a path context: Dockerfile builds need the checked-out files, and
      # VERSION below makes their MinVer result exactly match the release tag.
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/yanos/flower-server
          # A stable v1.2.3 tag publishes 1.2.3, 1.2, 1, and latest. A
          # prerelease only publishes its full version; major-zero releases do
          # not create a misleading floating `0` tag.
          tags: |
            type=semver,pattern={{version}},priority=1000
            type=semver,pattern={{major}}.{{minor}},priority=900
            type=semver,pattern={{major}},priority=800,enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,priority=700,enable=${{ !contains(github.ref_name, '-') }}
          flavor: |
            latest=false

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
